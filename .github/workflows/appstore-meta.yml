# App Store 스토어 정보(설명·키워드·스크린샷·심사 메모)를 appstore/ 폴더 내용으로 올린다.
# Actions 탭 > "App Store 스토어 정보 올리기" > Run workflow 로 직접 실행한다. (심사 제출은 하지 않음)
name: App Store 스토어 정보 올리기

on:
  workflow_dispatch:

jobs:
  upload-metadata:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: API 키 준비
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_KEY_P8"], "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "asc.json"), "w"))
          PY

      - name: 스토어 정보·스크린샷 업로드
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/keys/asc.json" \
            --app_identifier kr.brightbom.lotto \
            --platform ios \
            --app_version 1.0 \
            --metadata_path appstore/metadata \
            --screenshots_path appstore/screenshots \
            --overwrite_screenshots true \
            --skip_binary_upload true \
            --skip_app_version_update true \
            --force true \
            --submit_for_review false \
            --run_precheck_before_submit false

      - name: 키 파일 삭제
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
